<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 AI 교육 연구 및 실천 교사 그룹</title>
    <style>
        /* 기본 폰트 및 배경 설정 */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 60px 20px;
            text-align: center;
        }

        /* 헤더(타이틀) 스타일 */
        .header {
            margin-bottom: 60px;
        }
        .header h1 {
            font-size: 2.8em;
            color: #1a252f;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }
        .header p {
            font-size: 1.2em;
            color: #555;
            font-weight: 300;
        }

        /* 프로필 카드 그리드 컨테이너 */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 개별 프로필 카드 스타일 */
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 40px 20px;
            width: 220px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        /* 프로필 이미지 (원형 마스크 및 테두리) */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            border: 5px solid #eee;
            background-color: #fafafa;
            transition: border-color 0.3s ease;
        }

        /* 5대 연구 분야별 고유 포인트 컬러 */
        .card.ktr:hover .profile-img { border-color: #2ecc71; } /* 초록: 데이터 */
        .card.ijs:hover .profile-img { border-color: #e67e22; } /* 주황: 프레임워크 */
        .card.ksj:hover .profile-img { border-color: #3498db; } /* 파랑: 로봇/코딩 */
        .card.lyk:hover .profile-img { border-color: #9b59b6; } /* 보라: 실감형 */
        .card.cjy:hover .profile-img { border-color: #1abc9c; } /* 청록: AI 튜터링 */

        /* 텍스트 스타일 */
        .name {
            font-size: 1.4em;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #2c3e50;
        }
        .role {
            font-size: 0.95em;
            color: #666;
            line-height: 1.5;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>D-AILab</h1>
        <p>함께 배우고, 연구하며, 실천하는 디지털·AI 미래 교육</p>
    </div>

    <div class="grid-container">
        <div class="card ktr">
            <img src="ktr.png" alt="ktr 선생님" class="profile-img" onerror="this.src='https://via.placeholder.com/130?text=ktr'">
            <div class="name">ktr</div>
            <div class="role">교육 데이터 분석<br>& 맞춤형 학습</div>
        </div>

        <div class="card ijs">
            <img src="ijs.png" alt="ijs 선생님" class="profile-img" onerror="this.src='https://via.placeholder.com/130?text=ijs'">
            <div class="name">ijs</div>
            <div class="role">수업 연구<br>& 혁신 프레임워크</div>
        </div>

        <div class="card ksj">
            <img src="ksj.png" alt="ksj 선생님" class="profile-img" onerror="this.src='https://via.placeholder.com/130?text=ksj'">
            <div class="name">ksj</div>
            <div class="role">로봇 및 창의 학습<br>(피지컬 컴퓨팅)</div>
        </div>

        <div class="card lyk">
            <img src="lyk.png" alt="lyk 선생님" class="profile-img" onerror="this.src='https://via.placeholder.com/130?text=lyk'">
            <div class="name">lyk</div>
            <div class="role">실감형 콘텐츠<br>(VR/AR) 설계</div>
        </div>

        <div class="card cjy">
            <img src="cjy.png" alt="cjy 선생님" class="profile-img" onerror="this.src='https://via.placeholder.com/130?text=cjy'">
            <div class="name">cjy</div>
            <div class="role">AI 맞춤형 학습<br>& 튜터링 시스템</div>
        </div>
    </div>

</body>
</html>
